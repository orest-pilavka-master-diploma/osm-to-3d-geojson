spark-config = {
  app-name = "OSM to 3D GeoJSON"
  master = "local[*]"
}

common = {
  default-storage-level = "DISK_ONLY",
  workflows = "",
  workflows = ${?WORKFLOWS},
  geohash-precision = 7,
 }

data-dir = "NA"

osm = {
    osm-in-path = "NA"
}

out-path = "NA"

# When true, write one GeoJSON file per geohash cell in a prefix-nested tree under a
# timestamped version dir. When false, fall back to a single combined file.
tiled-output = true


# Overture Maps buildings. When enabled = false the Overture reader and the
# OSM/Overture merge are skipped completely.
overture = {
  enabled = false
  overture-in-path = "NA"
  buffer-meters = 1.0
  min-overlap-ratio = 0.9
  grid-cell-degrees = 0.005
}
admin-place = {
  disputed-view-path = "mapping/admin/dispute_admin_view.csv"
  admin-place-out = ${data-dir}"/compiler_processed/admin_hierarchy/admin_place"
  admin-place-ground-out = ${data-dir}"/compiler_processed/admin_hierarchy/ground_admin_place"
}

building-levels-model = {
  mode = "train"
  model-path = "data/model/building-levels-rf"
  prediction-enabled = false
  neighborhood-radius-meters = 75.0
  train-ratio = 0.8
  num-trees = 200
  max-depth = 15
  seed = 42
  fallback-levels = 1
}